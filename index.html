<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#000000" />
    <title>heart code</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="app">
      <header class="topbar">
        <button class="icon-button back" type="button" aria-label="Go back">
          <span></span>
        </button>
        <h1>heart code</h1>
        <button class="icon-button camera" id="save-heart" type="button" aria-label="Save the heart">
          <svg viewBox="0 0 48 48" aria-hidden="true">
            <path d="M15 11.5 18.2 7h11.6l3.2 4.5h3.5A5.5 5.5 0 0 1 42 17v17.5a5.5 5.5 0 0 1-5.5 5.5h-25A5.5 5.5 0 0 1 6 34.5V17a5.5 5.5 0 0 1 5.5-5.5H15Z" />
            <circle cx="24" cy="25" r="9" />
            <path class="camera-shadow" d="M39 15.5c2.8 1 4.5 3.4 4.5 6.4v13c0 5.8-3.4 9.6-9.4 9.6H21.8" />
          </svg>
        </button>
      </header>

      <section class="heart-stage" aria-label="Animated heart made from I love you text">
        <div class="view-switch" aria-label="Cambiar visual">
          <button type="button" data-view="heart" aria-label="Vista de corazón">♡</button>
          <button class="is-active" type="button" data-view="saturn" aria-label="Vista de Saturno con el número 19">♄</button>
        </div>
        <canvas id="heart-canvas"></canvas>
        <button class="heart-hitbox" id="heart-toggle" type="button" aria-label="Play music"></button>
      </section>

      <section class="player" aria-label="Music player">
        <div class="track-copy">
          <p class="eyebrow">REPRODUCIENDO</p>
          <p class="track-name" id="track-name">1979 — The Smashing Pumpkins</p>
          <div class="playlist" aria-label="Built-in songs">
            <button class="is-active" type="button" data-track="0">1979</button>
            <button type="button" data-track="1">Digital Love</button>
            <button type="button" data-track="2">Friday I'm in Love</button>
            <button type="button" data-track="3">Midnight City</button>
            <button type="button" data-track="4">No Existes</button>
            <button type="button" data-track="5">Heroes</button>
          </div>
          <label class="upload-song" aria-label="Subir una canción">
            <input id="file-picker" type="file" accept="audio/*" />
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v12m0-12L7.5 7.5M12 3l4.5 4.5M5 15v4h14v-4" /></svg>
            <span>subir canción</span>
          </label>
        </div>

        <div class="timeline-row">
          <span id="current-time">0:00</span>
          <input id="timeline" type="range" min="0" max="100" value="0" step="0.1" aria-label="Song progress" />
          <span id="duration">0:00</span>
        </div>

        <div class="transport">
          <button class="control-button secondary" id="previous" type="button" aria-label="Canción anterior">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 6v12M18 6l-8 6 8 6V6Z" /></svg>
          </button>
          <button class="control-button play" id="play" type="button" aria-label="Play">
            <svg class="play-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m8 5 11 7-11 7V5Z" /></svg>
            <svg class="pause-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 5h4v14H7zM14 5h4v14h-4z" /></svg>
          </button>
          <button class="control-button secondary" id="next" type="button" aria-label="Canción siguiente">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M16 6v12M6 6l8 6-8 6V6Z" /></svg>
          </button>
        </div>
      </section>

      <audio id="audio" src="assets/1979.mp3" preload="metadata"></audio>
    </main>

    <script src="script.js"></script>
  </body>
</html>
